name: One-time question bank UI patch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-question-bank-ui.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply CSS-only question bank polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          before = p.read_text(encoding="utf-8")
          marker = "/* question-bank-ui-polish: visual-only; preserve question data and behavior */"
          if marker in before:
              raise SystemExit("Patch marker already exists; refusing duplicate edit")
          required = ['&lt;section id=&quot;listPanel&quot;', '&lt;div class=&quot;list&quot; id=&quot;questionList&quot;', '&lt;div id=&quot;resultCount&quot;']
          if not all(x in before for x in required):
              raise SystemExit("Expected problem-bank DOM markers not found; refusing edit")
          close = before.rfind("&lt;/style&gt;")
          if close < 0:
              raise SystemExit("Embedded app stylesheet closing tag not found")
          css = """/* question-bank-ui-polish: visual-only; preserve question data and behavior */
          #listPanel{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
          #listPanel .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:4px 0 18px;padding:20px 18px;border:1px solid #e3eaf5;border-radius:22px;background:linear-gradient(135deg,#fff 0%,#f1f6ff 100%);box-shadow:0 10px 28px rgba(25,55,105,.055)}
          #listPanel .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:#315efb;margin-bottom:7px}
          #listPanel .page-head h2{font-size:clamp(23px,5vw,29px);line-height:1.2;letter-spacing:-.055em;margin:0;font-weight:950;color:#172b4d}
          #listPanel .search-label{max-width:46%;font-size:11px;line-height:1.4;font-weight:800;color:#315efb;background:#e9efff;border:1px solid #d9e4ff;border-radius:999px;padding:8px 11px;text-align:center}
          #listPanel .result-count{display:flex!important;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px;padding:0 2px;color:#64748b;font-size:12px;font-weight:750}
          #listPanel .list{display:grid;grid-template-columns:1fr;gap:11px;margin-top:0}
          #listPanel .list-card{position:relative;overflow:hidden;background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:17px 16px;box-shadow:0 5px 18px rgba(20,33,61,.045);transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
          #listPanel .list-card:active{transform:scale(.993);border-color:#b9c9ff;box-shadow:0 8px 22px rgba(49,94,251,.09)}
          #listPanel .list-card :is(.question,.question-text,.q-text,.title){line-height:1.7;letter-spacing:-.015em;overflow-wrap:anywhere}
          #listPanel .list-card :is(.muted,.meta,.category,.small){color:#66748b}
          #listPanel .list-card button{min-height:40px;border-radius:12px}
          #listPanel .list-card :is(.badge,.tag,.chip){border-radius:999px;font-weight:800}
          #listPanel .empty{margin-top:12px;padding:28px 18px;border:1px dashed #cbd5e1;border-radius:18px;background:#fff;color:#64748b;text-align:center}
          @media(min-width:680px){#listPanel .page-head{padding:24px 24px;margin-bottom:20px}#listPanel .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}#listPanel .list-card{padding:19px}}
          @media(max-width:380px){#listPanel .page-head{padding:17px 14px;border-radius:18px}#listPanel .search-label{font-size:10px;padding:7px 8px}#listPanel .list-card{padding:15px 13px;border-radius:16px}}
          """
          after = before[:close] + css + before[close:]
          if after.replace(css, "", 1) != before:
              raise SystemExit("Content preservation check failed")
          p.write_text(after, encoding="utf-8")
          verify = p.read_text(encoding="utf-8")
          if marker not in verify or verify.replace(css, "", 1) != before:
              raise SystemExit("Post-write validation failed")
          print(f"CSS-only patch verified. Original chars={len(before)}, updated chars={len(verify)}, exact data/markup preservation=True")
          PY
      - name: Commit UI patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-question-bank-ui.yml
          git add index.html
          git commit -m "Polish question bank UI while preserving all questions"
          git push origin main
