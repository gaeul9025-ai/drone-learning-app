name: Repair drone light theme

on:
  push:
    branches:
      - codex/connection-check-20261011

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted CSS patch
        run: node .github/scripts/patch-white-theme.mjs
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore white theme navigation and quiz header"
          git push
