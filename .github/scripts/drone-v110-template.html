ss="nav-label">설정</span></button></nav>
<section class="quiz-page" id="quizPage" aria-label="문제 풀이"><header class="quiz-header"><button class="icon-button" id="quizBack" aria-label="문제풀이 나가기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="quiz-count" id="quizCount"></div><button class="icon-button bookmark-button" id="quizBookmark" aria-label="북마크"></button></header><div class="quiz-progress"><div class="quiz-progress-fill" id="quizProgress"></div></div><div class="quiz-scroll" id="quizScroll"></div><footer class="quiz-footer" id="quizFooter"></footer></section>
<div class="sheet-backdrop" id="sheetBackdrop"><section class="answer-sheet" role="dialog" aria-modal="true" aria-label="정답과 해설"><div class="sheet-handle"></div><div class="sheet-scroll" id="sheetScroll"></div><div class="sheet-actions" id="sheetActions"></div></section></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 class="modal-title" id="modalTitle"></h2><p class="modal-copy" id="modalCopy"></p><div class="modal-actions" id="modalActions"></div></section></div></div>
<script>
const QUESTIONS=__QUESTIONS_JSON__;
const STORE_KEY='drone_exam_v1_clean',SUBJECTS=['항공법규','항공기상','비행이론 및 운용'];
function dateKey(v){const d=v instanceof Date?v:new Date(v||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function defaults(){return{stats:{},conceptStats:{},bookmarks:{},confidence:{},notes:{},history:[],lastSubject:'weather',recentIds:[],theme:'light',v110:{examDate:'',dailyGoal:20,fontSize:'normal',theme:'light',wrongFilter:'전체',quiz:{ids:[],index:0,type:'practice',subject:'전체',selected:null,checked:false,results:{},completed:false},statsAnimated:false}}}
function loadStore(){let old={};try{old=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(_){}const d=defaults(),s=Object.assign(d,old);s.stats=old.stats||{};s.bookmarks=old.bookmarks||{};s.history=Array.isArray(old.history)?old.history:[];s.recentIds=Array.isArray(old.recentIds)?old.recentIds:[];s.v110=Object.assign(d.v110,old.v110||{});s.v110.quiz=Object.assign(d.v110.quiz,old.v110&&old.v110.quiz||{});s.v110.quiz.results=Object.assign({},s.v110.quiz.results||{});return s}
const store=loadStore();let routeNow='home',modalConfirm=null,sheetOpen=false,statsAnimatedOnce=!!store.v110.statsAnimated;
function save(){try{store.theme=store.v110.theme;localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(_){toast('기록을 저장하지 못했어요. 저장 공간을 확인해 주세요.')}}
function icon(n,size=24,filled=false){const p={bookmark:filled?'<path d="M6 3h12v18l-6-4-6 4Z" fill="currentColor"/>':'<path d="M6 3h12v18l-6-4-6 4Z"/>','chevron-right':'<path d="m9 18 6-6-6-6"/>','check':'<path d="m5 12 4 4L19 6"/>','x':'<path d="m18 6-12 12M6 6l12 12"/>','check-circle':'<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>','x-circle':'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>','file-check':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="m8 15 2.5 2.5L16 12"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'};return'<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[n]||p.check)+'</svg>'}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getQ(id){return QUESTIONS.find(q=>q.id===id)}function stat(id){return store.stats[id]||{right:0,wrong:0,unknown:0,seen:0,last:0}}function bookmarked(id){return!!store.bookmarks[id]}
function totalFor(sub){let n=0;for(const q of QUESTIONS)if(sub==='전체'||q.subject===sub)n++;return n}
function subjectStat(sub){let seen=0,r=0,w=0,u=0;for(const q of QUESTIONS){if(sub!=='전체'&&q.subject!==sub)continue;const s=store.stats[q.id];if(s&&s.seen)seen++;if(s){r+=s.right||0;w+=s.wrong||0;u+=s.unknown||0}}const tries=r+w+u;return{seen,right:r,wrong:w,tries,accuracy:tries?Math.round(r/tries*100):0}}
function dayCount(){return store.history.filter(h=>h&&dateKey(h.t||Date.now())===dateKey(new Date())).length}
function streak(){const ds=new Set(store.history.filter(h=>h&&h.t).map(h=>dateKey(h.t)));let d=new Date();if(!ds.has(dateKey(d))){d.setDate(d.getDate()-1);if(!ds.has(dateKey(d)))return 0}let n=0;while(ds.has(dateKey(d))){n++;d.setDate(d.getDate()-1)}return n}
function fmtDate(s){if(!s)return'';const p=s.split('-');return p.length===3?p[0]+'. '+Number(p[1])+'. '+Number(p[2])+'.':s}
function renderHome(){const today=dayCount(),goal=Number(store.v110.dailyGoal)||20,exam=store.v110.examDate,dd=exam?Math.round((new Date(exam+'T00:00:00')-new Date(dateKey(new Date())+'T00:00:00'))/86400000):null;const dday=exam?'<div class="dday-card"><div class="dday-copy"><span class="dday-label">시험일까지</span><span class="dday-date">'+esc(fmtDate(exam))+'</span></div><strong class="dday-value">'+(dd===0?'D-Day':dd>0?'D-'+dd:'D+'+Math.abs(dd))+'</strong><button class="dday-edit" data-action="exam-date" aria-label="시험일 변경">'+icon('calendar')+'</button></div>':'<div><button class="text-button" data-action="exam-date">시험일 설정하기 '+icon('chevron-right')+'</button></div>';const cards=SUBJECTS.map(sub=>{const total=totalFor(sub),s=subjectStat(sub);return'<button class="subject-card" data-subject="'+esc(sub)+'"><div class="subject-top"><div class="subject-info"><span class="subject-title">'+esc(sub)+'</span><span class="subject-caption">'+total.toLocaleString('ko-KR')+'문제 중 '+s.seen.toLocaleString('ko-KR')+'문제 완료</span></div><span class="subject-accuracy">'+(s.tries?s.accuracy+'%':'—')+'</span></div><div class="progress-track"><div class="progress-fill" style="width:'+(total?Math.min(100,s.seen/total*100):0)+'%"></div></div></button>'}).join('');document.getElementById('homeContent').innerHTML=dday+'<section class="section"><h2 class="section-heading">오늘의 학습</h2><div class="card today-card"><div><span class="today-label">오늘 푼 문제</span><div class="today-numbers"><span>'+today+'</span><span class="today-total">/ '+goal+'</span></div></div><div class="progress-track"><div class="progress-fill" style="width:'+Math.min(100,today/goal*100)+'%"></div></div><button class="primary-button" data-action="resume">이어서 풀기</button></div></section><section class="section"><h2 class="section-heading">과목별 학습 현황</h2><div class="subject-list">'+cards+'</div></section><section class="section"><button class="mock-card" data-action="mock"><span class="mock-copy"><span class="mock-title">모의고사 40문제</span><span class="mock-caption">랜덤 출제 · 합격 기준 70%</span></span>'+icon('chevron-right')+'</button></section><div class="page-bottom-space"></div>'}
function renderStudy(){document.getElementById('studyList').innerHTML=['전체',...SUBJECTS].map(sub=>'<button class="subject-choice" data-subject="'+esc(sub)+'"><span class="choice-meta"><span class="choice-title">'+(sub==='전체'?'전체 과목':esc(sub))+'</span><span class="choice-sub">'+totalFor(sub).toLocaleString('ko-KR')+'문제 · '+subjectStat(sub).seen+'문제 학습</span></span><span class="count-chip">풀기</span></button>').join('')}
function pickIds(sub,count){let a=QUESTIONS.filter(q=>sub==='전체'||q.subject===sub),recent=new Set(store.recentIds||[]),fresh=a.filter(q=>!recent.has(q.id));if(fresh.length>=count)a=fresh;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,count).map(q=>q.id)}
function startQuiz(sub='전체',type='practice',ids=null){const qids=ids||pickIds(sub,type==='mock'?40:20);if(!qids.length){toast('풀 수 있는 문제가 없어요.');return}store.v110.quiz={ids:qids,index:0,type,subject:sub,selected:null,checked:false,results:{},completed:false};store.lastSubject=sub;store.v110.lastSubject=sub;save();sheetOpen=false;location.hash='quiz'}
function resumeQuiz(){const q=store.v110.quiz;if(q.ids&&q.ids.length&&!q.completed&&q.index<q.ids.length)location.hash='quiz';else startQuiz(store.v110.lastSubject||'전체','practice')}
function wrongQs(){return QUESTIONS.filter(q=>(stat(q.id).wrong||0)>0).sort((a,b)=>(stat(b.id).wrong||0)-(stat(a.id).wrong||0))}
function startWrongQuiz(){const a=wrongQs();if(!a.length){toast('다시 풀 오답이 없어요.');return}for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}startQuiz('오답','wrong',a.slice(0,20).map(q=>q.id))}
function currentQ(){const q=store.v110.quiz;return q&&q.ids&&q.ids.length?getQ(q.ids[q.index]):null}
function displayQ(q){let t=String(q.question||'').trim(),parts=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);if(parts.length>1&&/^(교재 내용을 기준|다음 상황 또는 설명|핵심 개념을 정확히|비행·학습 현장에서|기체 점검 중|운용 담당자가)/.test(parts[0]))t=parts[parts.length-1];return t.replace(/^교재 내용을 기준으로 판단할 때,?\s*/,'').trim()||'문제 내용을 확인해 주세요.'}
function renderQuiz(){const s=store.v110.quiz,q=currentQ();if(!q){location.hash='study';return}const i=s.index,total=s.ids.length;document.getElementById('quizCount').innerHTML='<span class="current">'+(i+1)+'</span><span class="total"> / '+total+'</span>';document.getElementById('quizProgress').style.width=((i+1)/total*100)+'%';const b=document.getElementById('quizBookmark');b.classList.toggle('active',bookmarked(q.id));b.innerHTML=icon('bookmark',24,bookmarked(q.id));const opts=q.choices.map((v,j)=>{let c='option-card';if(s.selected===j)c+=' selected';if(s.checked){if(j===q.answer)c+=' correct';else if(j===s.selected)c+=' wrong';else c+=' dimmed'}const badge=s.checked&&j===q.answer?icon('check',20):s.checked&&j===s.selected&&j!==q.answer?icon('x',20):String(j+1);return'<button class="'+c+'" data-choice="'+j+'" '+(s.checked?'disabled':'')+'><span class="option-badge">'+badge+'</span><span class="option-text">'+esc(v)+'</span></button>'}).join('');document.getElementById('quizScroll').innerHTML='<span class="question-chip">'+esc(q.subject)+'</span><div class="question-number">Q'+(i+1)+'.</div><p class="question-text">'+esc(displayQ(q))+'</p>'+(q.image?'<img class="question-image" src="'+esc(q.image)+'" alt="문제 이미지">':'')+'<div class="option-list">'+opts+'</div>';document.getElementById('quizFooter').innerHTML=s.checked?'<button class="primary-button" data-action="open-explanation">해설 보기</button>':'<button class="'+(s.selected===null?'muted-button':'primary-button')+'" data-action="check-answer" '+(s.selected===null?'disabled':'')+'>정답 확인</button>';document.getElementById('sheetBackdrop').classList.toggle('open',s.checked&&sheetOpen);if(s.checked&&sheetOpen)renderSheet(q)}
function record(q,sel){const ok=sel===q.answer,st=store.stats[q.id]||(store.stats[q.id]={right:0,wrong:0,unknown:0,seen:0,last:0});st.seen=(st.seen||0)+1;st.last=Date.now();if(ok)st.right=(st.right||0)+1;else st.wrong=(st.wrong||0)+1;store.history.unshift({id:q.id,subject:q.subject,ans:sel,correct:ok,unknown:false,t:Date.now()});store.history=store.history.slice(0,600);store.recentIds=[q.id,...(store.recentIds||[])].filter((v,i,a)=>a.indexOf(v)===i).slice(0,120);store.v110.quiz.results[q.id]={selected:sel,correct:ok,t:Date.now()};save()}
function checkAnswer(){const s=store.v110.quiz,q=currentQ();if(!q||s.selected===null||s.checked)return;s.checked=true;record(q,s.selected);sheetOpen=true;save();renderQuiz()}
function renderSheet(q){const s=store.v110.quiz,ok=s.selected===q.answer;document.getElementById('sheetScroll').innerHTML='<h2 class="sheet-status '+(ok?'correct':'wrong')+'">'+icon(ok?'check-circle':'x-circle')+'<span>'+(ok?'정답이에요':'오답이에요')+'</span></h2>'+(ok?'':'<p class="sheet-answer">정답은 '+(q.answer+1)+'번이에요</p>')+'<div class="sheet-divider"></div><div class="sheet-explain-label">해설</div><p class="sheet-explanation">'+esc(q.explanation||'교재의 관련 개념을 다시 확인하세요.')+'</p>';document.getElementById('sheetActions').innerHTML='<button class="outline-button" data-action="sheet-bookmark">'+(bookmarked(q.id)?'북마크 해제':'북마크')+'</button><button class="primary-button" data-action="next-question">'+(s.index>=s.ids.length-1?'결과 보기':'다음 문제')+'</button>'}
function nextQ(){const s=store.v110.quiz;if(!s.checked)return;if(s.index>=s.ids.length-1){s.completed=true;save();sheetOpen=false;location.hash='result';return}s.index++;s.selected=null;s.checked=false;sheetOpen=false;save();renderQuiz();document.getElementById('quizScroll').scrollTop=0}
function renderResult(){const s=store.v110.quiz;let right=0,done=0;for(const id of s.ids||[]){const r=s.results&&s.results[id];if(r){done++;if(r.correct)right++}}const pct=done?Math.round(right/done*100):0,pass=done>0&&pct>=70;document.getElementById('resultContent').innerHTML='<div class="result-wrap"><p class="result-score">'+right+' / '+(s.ids||[]).length+'</p><p class="result-accuracy">정답률 '+pct+'%</p><p class="result-status '+(pass?'pass':'retry')+'">'+(pass?'합격권이에요':'조금 더 풀어봐요')+'</p><div class="result-actions"><button class="primary-button" data-action="retry-wrong">오답 다시 풀기</button><button class="outline-button" data-action="go-home">홈으로</button></div></div>'}
function renderWrong(){const all=wrongQs(),filter=store.v110.wrongFilter||'전체';document.getElementById('wrongTotal').textContent='총 '+all.length+'문제';document.getElementById('wrongFilters').innerHTML=['전체',...SUBJECTS,'북마크'].map(f=>'<button class="filter-chip '+(f===filter?'active':'')+'" data-filter="'+esc(f)+'">'+esc(f)+'</button>').join('');const list=filter==='북마크'?QUESTIONS.filter(q=>bookmarked(q.id)):all.filter(q=>filter==='전체'||q.subject===filter);if(!list.length){document.getElementById('wrongList').innerHTML='<div class="empty-state">'+icon(filter==='북마크'?'bookmark':'file-check',48)+'<div class="empty-title">'+(filter==='북마크'?'북마크한 문제가 없어요':'틀린 문제가 없어요')+'</div><div class="empty-caption">'+(filter==='북마크'?'문제 화면에서 북마크를 추가할 수 있어요':'문제를 풀면 틀린 항목이 여기에 쌓여요')+'</div></div>';return}document.getElementById('wrongList').innerHTML=list.slice(0,200).map(q=>{const st=stat(q.id),h=store.history.find(x=>x.id===q.id),days=h?Math.max(0,Math.floor((Date.now()-h.t)/86400000)):null;return'<button class="wrong-card" data-review="'+esc(q.id)+'"><div class="wrong-card-top"><span class="question-chip">'+esc(q.subject)+'</span><span class="wrong-meta">틀린 횟수 '+(st.wrong||0)+'회'+(days===null?'':' · '+(days===0?'오늘':days+'일 전'))+'</span></div><span class="wrong-question">'+esc(displayQ(q))+'</span></button>'}).join('')}
function reviewQ(id){const q=getQ(id);if(!q)return;const h=store.history.find(x=>x.id===id&&!x.correct);store.v110.quiz={ids:[id],index:0,type:'review',subject:q.subject,selected:h&&Number.isInteger(h.ans)?h.ans:null,checked:true,results:{[id]:{selected:h?h.ans:null,correct:false,t:Date.now()}},completed:false};save();sheetOpen=true;location.hash='quiz'}
function renderStats(){let total=0,r=0,w=0;Object.values(store.stats).forEach(s=>{total+=s.seen||0;r+=s.right||0;w+=s.wrong||0});const attempts=r+w,pct=attempts?Math.round(r/attempts*100):0;document.getElementById('statsContent').innerHTML='<div class="stats-grid"><div class="stat-card"><span class="stat-value">'+total.toLocaleString('ko-KR')+'</span><span class="stat-label">푼 문제 수</span></div><div class="stat-card"><span class="stat-value">'+(attempts?pct+'%':'—')+'</span><span class="stat-label">전체 정답률</span></div><div class="stat-card"><span class="stat-value">'+streak()+'</span><span class="stat-label">연속 학습일</span></div></div><section class="section" style="margin-top:24px"><h2 class="section-heading">과목별 정답률</h2><div class="chart-card">'+SUBJECTS.map(sub=>{const s=subjectStat(sub);return'<div class="chart-row"><div><div class="chart-name">'+esc(sub)+'</div><div class="chart-track"><div class="chart-fill" data-width="'+(s.tries?s.accuracy:0)+'%" style="width:'+(statsAnimatedOnce?(s.tries?s.accuracy:0):0)+'%"></div></div></div><div class="chart-percent">'+(s.tries?s.accuracy+'%':'—')+'</div></div>'}).join('')+'</div></section><section class="section" style="margin-top:24px"><h2 class="section-heading">최근 7일 학습량</h2><div class="chart-card"><div class="week-chart" id="weekChart"></div></div></section><section class="section" style="margin-top:24px"><h2 class="section-heading">취약 문제 TOP 5</h2><div class="chart-card" id="weakList"></div></section><div class="page-bottom-space"></div>';const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push({key:dateKey(d),label:['일','월','화','수','목','금','토'][d.getDay()],today:i===0,count:0})}for(const h of store.history){if(!h||!h.t)continue;const d=days.find(x=>x.key===dateKey(h.t));if(d)d.count++}const max=Math.max(1,...days.map(d=>d.count));document.getElementById('weekChart').innerHTML=days.map(d=>'<div class="week-day"><div class="week-bar-track"><div class="week-bar '+(d.today?'today':'')+'" style="height:'+Math.max(4,d.count/max*100)+'%"></div></div><span class="week-label">'+d.label+'</span></div>').join('');const weak=wrongQs().slice(0,5);document.getElementById('weakList').innerHTML=weak.length?'<div class="weak-list">'+weak.map((q,i)=>'<button class="weak-row" data-review="'+esc(q.id)+'"><span class="weak-rank">'+(i+1)+'</span><span class="weak-question">'+esc(displayQ(q))+'</span><span class="weak-count">'+(stat(q.id).wrong||0)+'회</span></button>').join('')+'</div>':'<div class="empty-state" style="min-height:120px"><div class="empty-title">아직 기록이 없어요</div></div>';if(!statsAnimatedOnce){requestAnimationFrame(()=>document.querySelectorAll('.chart-fill').forEach(el=>el.style.width=el.dataset.width));statsAnimatedOnce=true;store.v110.statsAnimated=true;save()}}
function renderSettings(){const v=store.v110;document.getElementById('settingsContent').innerHTML='<section class="section"><h2 class="section-heading">학습</h2><div class="settings-group"><div class="settings-row"><div><span class="settings-label">시험일</span><span class="settings-sub">'+(v.examDate?esc(fmtDate(v.examDate)):'시험일을 설정해 주세요')+'</span></div><div class="setting-control"><input class="date-input" type="date" id="examDateInput" value="'+esc(v.examDate||'')+'" aria-label="시험일 설정"></div></div><div class="settings-row"><span class="settings-label">하루 목표 문제 수</span><div class="setting-control"><div class="segmented">'+[10,20,30,40].map(n=>'<button class="segment '+(Number(v.dailyGoal)===n?'active':'')+'" data-goal="'+n+'">'+n+'</button>').join('')+'</div></div></div></div></section><section class="section" style="margin-top:24px"><h2 class="section-heading">화면</h2><div class="settings-group"><div class="settings-row"><span class="settings-label">글자 크기</span><div class="setting-control"><div class="segmented"><button class="segment '+(v.fontSize==='normal'?'active':'')+'" data-font="normal">보통</button><button class="segment '+(v.fontSize==='large'?'active':'')+'" data-font="large">크게</button></div></div></div><div class="settings-row"><span class="settings-label">다크 모드</span><div class="setting-control"><button class="toggle '+(v.theme==='dark'?'on':'')+'" data-action="toggle-theme" role="switch" aria-checked="'+(v.theme==='dark')+'" aria-label="다크 모드"></button></div></div></div></section><section class="section" style="margin-top:24px"><h2 class="section-heading">데이터</h2><div class="settings-group"><div class="settings-row"><div><span class="settings-label">학습 기록 초기화</span><span class="settings-sub">푼 문제, 정답률, 오답 기록을 삭제합니다</span></div><button class="danger-button" data-action="reset-records">초기화</button></div><div class="settings-row"><span class="settings-label">앱 버전</span><span class="version-value">1.1.0</span></div><div class="settings-row"><div><span class="settings-label">다른 학습 앱</span><span class="settings-sub">모바일로봇 CBT 열기</span></div><button class="icon-button" data-action="open-robot" aria-label="모바일로봇 CBT 열기">'+icon('chevron-right')+'</button></div></div></section><div class="page-bottom-space"></div>";document.getElementById('appShell').classList.toggle('large-text',v.fontSize==='large')}
function modal(title,copy,label,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalCopy').textContent=copy;document.getElementById('modalActions').innerHTML='<button class="outline-button" data-action="close-modal">취소</button><button class="primary-button" data-action="modal-confirm">'+esc(label)+'</button>';modalConfirm=fn;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');modalConfirm=null}
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;z-index:90;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 16px;border-radius:14px;background:var(--text);color:var(--surface);font-size:13px;box-shadow:var(--shadow);text-align:center';document.body.appendChild(el)}el.textContent=msg;el.classList.remove('hidden');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.add('hidden'),2200)}
function setTheme(){document.body.classList.toggle('dark',store.v110.theme==='dark');document.getElementById('appShell').classList.toggle('large-text',store.v110.fontSize==='large');document.querySelector('meta[name="theme-color"]').content=store.v110.theme==='dark'?'#0B1220':'#F8FAFC'}
function renderRoute(r){if(!['home','study','wrong','stats','settings','quiz','result'].includes(r))r='home';routeNow=r;store.v110.lastRoute=r;save();document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+r));document.getElementById('quizPage').classList.toggle('active',r==='quiz');document.getElementById('bottomNav').classList.toggle('hidden',r==='quiz'||r==='result');document.getElementById('homeHeader').classList.toggle('hidden',r==='quiz'||r==='result');document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.route===r));if(r!=='quiz')sheetOpen=false;if(r==='home')renderHome();if(r==='study')renderStudy();if(r==='wrong')renderWrong();if(r==='stats')renderStats();if(r==='settings')renderSettings();if(r==='quiz')renderQuiz();if(r==='result')renderResult();document.getElementById('sheetBackdrop').classList.toggle('open',r==='quiz'&&store.v110.quiz.checked&&sheetOpen);window.scrollTo(0,0)}
function go(r){if(r==='quiz'&&(!store.v110.quiz.ids||!store.v110.quiz.ids.length))r='study';location.hash=r}
document.addEventListener('click',e=>{let n=e.target.closest('[data-route]');if(n){go(n.dataset.route);return}let sub=e.target.closest('[data-subject]');if(sub){startQuiz(sub.dataset.subject,'practice');return}let ch=e.target.closest('[data-choice]');if(ch){const s=store.v110.quiz;if(s.checked)return;s.selected=Number(ch.dataset.choice);save();renderQuiz();return}let fl=e.target.closest('[data-filter]');if(fl){store.v110.wrongFilter=fl.dataset.filter;save();renderWrong();return}let rv=e.target.closest('[data-review]');if(rv){reviewQ(rv.dataset.review);return}let g=e.target.closest('[data-goal]');if(g){store.v110.dailyGoal=Number(g.dataset.goal);save();renderSettings();return}let ft=e.target.closest('[data-font]');if(ft){store.v110.fontSize=ft.dataset.font;save();renderSettings();return}let a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'exam-date':go('settings');setTimeout(()=>{const d=document.getElementById('examDateInput');if(d)d.focus()},0);break;case'resume':resumeQuiz();break;case'mock':startQuiz('전체','mock');break;case'check-answer':checkAnswer();break;case'open-explanation':sheetOpen=true;renderQuiz();break;case'next-question':nextQ();break;case'sheet-bookmark':{const q=currentQ();if(q){if(bookmarked(q.id))delete store.bookmarks[q.id];else store.bookmarks[q.id]=1;save();renderSheet(q);document.getElementById('quizBookmark').innerHTML=icon('bookmark',24,bookmarked(q.id));document.getElementById('quizBookmark').classList.toggle('active',bookmarked(q.id))}break}case'retry-wrong':startWrongQuiz();break;case'go-home':go('home');break;case'toggle-theme':store.v110.theme=store.v110.theme==='dark'?'light':'dark';save();setTheme();renderSettings();break;case'reset-records':modal('학습 기록을 초기화할까요?','푼 문제, 정답률, 오답노트와 북마크가 삭제됩니다. 이 작업은 되돌릴 수 없습니다.','초기화',()=>{store.stats={};store.conceptStats={};store.bookmarks={};store.confidence={};store.notes={};store.history=[];store.recentIds=[];store.v110.quiz={ids:[],index:0,type:'practice',subject:'전체',selected:null,checked:false,results:{},completed:false};save();closeModal();go('settings')});break;case'open-robot':window.parent.postMessage({type:'open-robot'},'*');break;case'close-modal':closeModal();break;case'modal-confirm':{const fn=modalConfirm;closeModal();if(fn)fn();break}}});
document.getElementById('quizBack').addEventListener('click',()=>modal('풀이를 나갈까요?','현재 문제 위치와 진행 기록은 저장됩니다.','나가기',()=>{sheetOpen=false;go('home')}));
document.getElementById('quizBookmark').addEventListener('click',()=>{const q=currentQ();if(!q)return;if(bookmarked(q.id))delete store.bookmarks[q.id];else store.bookmarks[q.id]=1;save();const b=document.getElementById('quizBookmark');b.classList.toggle('active',bookmarked(q.id));b.innerHTML=icon('bookmark',24,bookmarked(q.id));if(store.v110.quiz.checked&&sheetOpen)renderSheet(q)});
document.getElementById('sheetBackdrop').addEventListener('click',e=>{if(e.target.id==='sheetBackdrop'){sheetOpen=false;document.getElementById('sheetBackdrop').classList.remove('open');document.getElementById('quizFooter').innerHTML='<button class="primary-button" data-action="open-explanation">해설 보기</button>'}});
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.getElementById('settingsContent').addEventListener('change',e=>{if(e.target.id==='examDateInput'){store.v110.examDate=e.target.value;save();renderSettings()}});
window.addEventListener('hashchange',()=>renderRoute(location.hash.slice(1)||'home'));setTheme();if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#home');renderRoute(location.hash.slice(1)||'home');
</script></body></html>
